[project]
name = "sql-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.12",
    "mysql-connector-python>=26.7.0",
    "polars>=1.44.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.34.0",
]

[project.scripts]
sql-agent = "sql_agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
